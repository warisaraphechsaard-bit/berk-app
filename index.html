<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>โปรแกรมเบิก</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;color:#222;padding-bottom:82px}
header{background:#111827;color:#fff;padding:18px 16px}.wrap{max-width:850px;margin:auto}.wallet{font-size:30px;font-weight:800;margin-top:4px}
main{padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
h2{margin:0 0 12px;font-size:19px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #d4d8df;border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:700}.primary{background:#111827;color:#fff}.gray{background:#eef1f5}.danger{background:#fee2e2;color:#991b1b}
.status{display:flex;gap:8px}.status button{flex:1;background:#f0f2f5}.status .active.green{background:#dcfce7;color:#166534;outline:3px solid #22c55e}.status .active.yellow{background:#fef3c7;color:#92400e;outline:3px solid #f59e0b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f7f8fa;padding:12px;border-radius:12px}.stat b{display:block;font-size:20px;margin-top:3px}
.item{border:1px solid #e1e4e9;border-radius:12px;padding:11px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#6b7280;font-size:12px}
.checkbox-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.check{display:flex;align-items:center;gap:8px;background:#f5f6f8;padding:10px;border-radius:10px;font-weight:600}.check input{width:20px;height:20px}
.filterbar{background:#eef2ff;border:1px solid #c7d2fe;padding:12px;border-radius:12px;margin:10px 0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.pill.green{background:#dcfce7;color:#166534}.pill.yellow{background:#fef3c7;color:#92400e}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;background:transparent;color:#555;padding:6px 2px;font-size:11px}nav button.active{color:#111827}
@media(max-width:420px){.checkbox-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div>💰 กระเป๋าเงิน</div><div class="wallet" id="wallet">30,000.00 บาท</div></div></header>
<main class="wrap" id="app"></main>
<nav>
<button data-page="home">🏠<br>ยอดเบิก</button>
<button data-page="summary">📊<br>สรุป</button>
<button data-page="reserve">📦<br>สำรอง</button>
<button data-page="history">📜<br>ประวัติ</button>
<button data-page="settings">⚙️<br>ตั้งค่า</button>
</nav>
<script>
const KEY='berk_new_v2';
const defaultHouses=['วริศ','ศิลา','ภูดิส','สามชั้น','แพรี่','ปุณปุณ','ริชชี่','เค้กส้ม','พริกเพชร','อื่นๆ'];
const defaultSecs=['อุษา','เดีย','แนน','ใหม่','นิว','หญิง','เกด','พริก','แจ๋ว','หมิว'];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{wallet:30000,houses:[...defaultHouses],secretaries:[...defaultSecs],records:[],statuses:{},adjust:[]};
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const getStatus=(h,d)=>db.statuses[d+'|'+h]||'green';
const fee=r=>r.house==='อื่นๆ'?0:r.amount*.10;
const net=r=>r.house==='อื่นๆ'?r.amount:r.amount*.90;
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();}
function setPage(p){window.currentPage=p;render();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
window.currentPage='home';

function render(){
 $('wallet').textContent=money(db.wallet)+' บาท';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===window.currentPage));
 ({home:renderHome,summary:renderSummary,reserve:renderReserve,history:renderHistory,settings:renderSettings}[window.currentPage])();
}

function renderHome(){
 $('app').innerHTML=`<section class="card"><h2>ทำรายการเบิก</h2>
 <label>วันที่</label><input id="fDate" type="date" value="${today()}">
 <label>บ้าน</label><select id="fHouse">${db.houses.map(h=>`<option value="${h}">${h}</option>`).join('')}</select>
 <label>สถานะบ้าน</label><div id="homeStatus" class="status"></div>
 <label>ยอดเบิกเต็มจำนวน</label><input id="fAmount" type="number" min="0" step="0.01" placeholder="เช่น 3,000">
 <label>เลขา</label><select id="fSec">${db.secretaries.map(s=>`<option>${s}</option>`).join('')}</select>
 <label>สถานะโอนลูกค้า</label><select id="fPaid"><option value="no">ยังไม่โอนลูกค้า</option><option value="yes">โอนลูกค้าแล้ว</option></select>
 <div id="calc" class="filterbar"></div><button class="primary" style="width:100%;margin-top:8px" onclick="addRecord()">บันทึกรายการ</button></section>`;
 ['fDate','fHouse','fAmount'].forEach(id=>$(id).addEventListener('input',updateHome));
 updateHome();
}
function updateHome(){
 const d=$('fDate').value,h=$('fHouse').value,a=+$('fAmount').value||0,s=getStatus(h,d);
 $('homeStatus').innerHTML=`<button class="${s==='green'?'active green':''}" onclick="changeStatus('${h}','${d}','green')">🟢 เบิกได้</button><button class="${s==='yellow'?'active yellow':''}" onclick="changeStatus('${h}','${d}','yellow')">🟡 หยุดเบิก</button>`;
 const r={house:h,amount:a};
 $('calc').innerHTML=`<b>สถานะวันนี้: ${s==='green'?'🟢 เบิกได้':'🟡 หยุดเบิก'}</b><br>ลูกค้าได้รับ: <b>${money(net(r))}</b> บาท<br>เลขา: <b>${money(fee(r))}</b> บาท${s==='yellow'?'<br><span class="muted">รายการบ้านหยุดเบิกจะเป็นเงินสำรองของบ้านนี้</span>':''}`;
}
function changeStatus(h,d,s){db.statuses[d+'|'+h]=s;save();}
function addRecord(){
 const a=+$('fAmount').value||0;if(a<=0)return alert('กรุณาใส่ยอดเบิก');
 const r={id:Date.now(),date:$('fDate').value,house:$('fHouse').value,amount:a,secretary:$('fSec').value,paid:$('fPaid').value,returned:false};
 if(r.paid==='yes')db.wallet-=a;
 db.records.push(r);save();alert('บันทึกรายการแล้ว');window.currentPage='history';render();
}

function renderSummary(){
 $('app').innerHTML=`<section class="card"><h2>📊 สรุป</h2>
 <label>วันที่ที่ต้องการดู</label><input id="sumDate" type="date" value="${today()}">
 <div class="filterbar"><b>เลือกบ้านที่ต้องการดู</b><div class="muted">เลือกได้หลายบ้านพร้อมกัน</div>
 <div class="checkbox-list" id="houseChecks"></div>
 <button class="gray" style="margin-top:8px;width:100%" onclick="clearHouseFilter()">ดูทุกบ้าน</button></div>
 <div id="summaryResult"></div></section>`;
 $('sumDate').addEventListener('change',drawSummary);
 $('houseChecks').innerHTML=db.houses.map(h=>`<label class="check"><input type="checkbox" value="${h}" onchange="drawSummary()"> ${h}</label>`).join('');
 drawSummary();
}
function selectedHouses(){return [...document.querySelectorAll('#houseChecks input:checked')].map(x=>x.value)}
function clearHouseFilter(){document.querySelectorAll('#houseChecks input').forEach(x=>x.checked=false);drawSummary();}
function drawSummary(){
 const d=$('sumDate').value,selected=selectedHouses(),list=db.houses.filter(h=>!selected.length||selected.includes(h));
 const rs=db.records.filter(r=>r.date===d&&list.includes(r.house));
 const total=rs.reduce((a,r)=>a+r.amount,0);
 const green=rs.filter(r=>getStatus(r.house,d)==='green').reduce((a,r)=>a+r.amount,0);
 const stopped=rs.filter(r=>getStatus(r.house,d)==='yellow').reduce((a,r)=>a+r.amount,0);
 const reserve=rs.filter(r=>getStatus(r.house,d)==='yellow'&&!r.returned).reduce((a,r)=>a+r.amount,0);
 const secretary=rs.reduce((a,r)=>a+fee(r),0);
 const paidFee=rs.filter(r=>r.paid==='yes').reduce((a,r)=>a+fee(r),0);
 let out=`<div class="stats"><div class="stat">ยอดทั้งหมด<b>${money(total)}</b></div><div class="stat">ยอดเบิกได้<b>${money(green)}</b></div><div class="stat">ยอดหยุดเบิก<b>${money(stopped)}</b></div><div class="stat">ยอดสำรอง<b>${money(reserve)}</b></div><div class="stat">เลขา<b>${money(secretary)}</b></div><div class="stat">ยอดโอนเลขา<b>${money(paidFee)}</b></div></div>`;
 out+=`<div class="filterbar"><b>กำลังดู: ${selected.length?selected.join(' + '):'ทุกบ้าน'}</b></div>`;
 list.forEach(h=>{
   const x=rs.filter(r=>r.house===h),t=x.reduce((a,r)=>a+r.amount,0),isGreen=getStatus(h,d)==='green',res=x.filter(r=>!r.returned&&getStatus(h,d)==='yellow').reduce((a,r)=>a+r.amount,0),f=x.reduce((a,r)=>a+fee(r),0),pf=x.filter(r=>r.paid==='yes').reduce((a,r)=>a+fee(r),0);
   out+=`<div class="item"><div class="row"><b>${h}</b><span class="pill ${isGreen?'green':'yellow'}">${isGreen?'🟢 เบิกได้':'🟡 หยุดเบิก'}</span></div><div>ยอดทั้งหมด: <b>${money(t)}</b> บาท</div><div>ยอดเบิกได้: ${money(isGreen?t:0)} บาท</div><div>ยอดหยุดเบิก: ${money(isGreen?0:t)} บาท</div><div>ยอดสำรอง: <b>${money(res)}</b> บาท</div><div>เลขา: ${money(f)} บาท</div><div>ยอดโอนเลขา: ${money(pf)} บาท</div></div>`;
 });
 $('summaryResult').innerHTML=out;
}

function renderReserve(){
 $('app').innerHTML=`<section class="card"><h2>📦 สำรอง</h2><label>วันที่</label><input id="reserveDate" type="date" value="${today()}" onchange="drawReserve()"><div id="reserveResult"></div></section>`;drawReserve();
}
function drawReserve(){
 const d=$('reserveDate').value;
 $('reserveResult').innerHTML=db.houses.map(h=>{const x=db.records.filter(r=>r.date===d&&r.house===h&&getStatus(h,d)==='yellow'&&!r.returned).reduce((a,r)=>a+r.amount,0);return `<div class="item"><div class="row"><b>${h}</b><span class="pill ${getStatus(h,d)==='green'?'green':'yellow'}">${getStatus(h,d)==='green'?'เบิกได้':'หยุดเบิก'}</span></div>เงินสำรอง: <b>${money(x)}</b> บาท${x?'<div class="muted">จะคืนเข้ากระเป๋าในวันที่บ้านนี้เป็นเบิกได้</div>':''}</div>`}).join('');
}
function renderHistory(){
 $('app').innerHTML=`<section class="card"><h2>📜 ประวัติ</h2><div class="stats"><div><label>จากวันที่</label><input id="fromDate" type="date"></div><div><label>ถึงวันที่</label><input id="toDate" type="date"></div></div><button class="primary" style="margin-top:10px" onclick="drawHistory()">ค้นหา</button><div id="historyResult"></div></section>`;drawHistory();
}
function drawHistory(){
 const f=$('fromDate').value,t=$('toDate').value;
 const rs=db.records.filter(r=>(!f||r.date>=f)&&(!t||r.date<=t)).sort((a,b)=>b.id-a.id);
 $('historyResult').innerHTML=rs.map(r=>`<div class="item"><div class="row"><b>${r.house}</b><span>${r.date}</span></div>เบิก ${money(r.amount)} บาท | ลูกค้า ${money(net(r))} บาท<br>เลขา ${r.secretary} ${money(fee(r))} บาท<br>${r.paid==='yes'?'✅ โอนลูกค้าแล้ว':'⏳ ยังไม่โอนลูกค้า'}<div class="grid" style="margin-top:8px"><button class="gray" onclick="editRecord(${r.id})">แก้ไข</button><button class="danger" onclick="deleteRecord(${r.id})">ลบ</button></div></div>`).join('')||'<p class="muted">ยังไม่มีรายการ</p>';
}
function editRecord(id){const r=db.records.find(x=>x.id===id);if(!r)return;const a=prompt('แก้ยอดเบิก',r.amount);if(a===null)return;const n=+a;if(n<=0)return alert('ยอดไม่ถูกต้อง');if(r.paid==='yes')db.wallet+=r.amount;r.amount=n;if(confirm('รายการนี้โอนลูกค้าแล้วใช่ไหม?')){r.paid='yes';db.wallet-=n}else r.paid='no';save();}
function deleteRecord(id){const r=db.records.find(x=>x.id===id);if(!r||!confirm('ลบรายการนี้ใช่ไหม?'))return;if(r.paid==='yes')db.wallet+=r.amount;db.records=db.records.filter(x=>x.id!==id);save();}

function renderSettings(){
 $('app').innerHTML=`<section class="card"><h2>⚙️ ตั้งค่า</h2><label>ปรับกระเป๋าเงิน</label><input id="adjustAmount" type="number" placeholder="เช่น 500 หรือ -500"><button class="primary" style="margin-top:8px" onclick="adjustWallet()">บันทึก</button><hr><b>กระเป๋าปัจจุบัน ${money(db.wallet)} บาท</b></section>
 <section class="card"><h2>🏠 บ้าน</h2><input id="newHouse" placeholder="ชื่อบ้านใหม่"><button class="primary" style="margin-top:8px" onclick="addHouse()">เพิ่มบ้าน</button>${db.houses.map(h=>`<div class="item">${h}</div>`).join('')}</section>
 <section class="card"><h2>👩‍💼 เลขา</h2><input id="newSec" placeholder="ชื่อเลขาใหม่"><button class="primary" style="margin-top:8px" onclick="addSec()">เพิ่มเลขา</button>${db.secretaries.map(s=>`<div class="item">${s}</div>`).join('')}</section>`;
}
function adjustWallet(){const n=+$('adjustAmount').value||0;if(!n)return;db.wallet+=n;db.adjust.push({date:today(),amount:n});save();}
function addHouse(){const h=$('newHouse').value.trim();if(!h)return;if(db.houses.includes(h))return alert('มีบ้านนี้แล้ว');db.houses.push(h);save();}
function addSec(){const s=$('newSec').value.trim();if(!s)return;if(db.secretaries.includes(s))return alert('มีเลขานี้แล้ว');db.secretaries.push(s);save();}
render();
</script>
</body>
</html>
